<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動物森友會的日常紀錄 🦎</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --secondary: #FF9800;
            --bg-color: #f1f8f5;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --border-color: #e0e0e0;
            --shadow: 0 8px 24px rgba(76, 175, 80, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#4caf50 1px, transparent 1px), radial-gradient(#ff9800 1px, #f1f8f5 1px);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            color: var(--text-dark); padding: 20px; min-height: 100vh;
        }
        .container {
            max-width: 650px; margin: 20px auto; background: var(--card-bg);
            border-radius: 30px; padding: 30px 25px; box-shadow: var(--shadow);
            border: 4px solid #4CAF50;
        }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 26px; color: #2e7d32; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: var(--text-light); }
        
        .tab-nav {
            display: flex; gap: 10px; margin-bottom: 25px;
            background: #eee; padding: 6px; border-radius: 15px;
        }
        .tab-btn {
            flex: 1; padding: 12px; text-align: center; font-weight: bold;
            background: none; border: none; border-radius: 10px; cursor: pointer;
            color: var(--text-light); transition: all 0.3s;
        }
        .tab-btn.active {
            background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(76,175,80,0.2);
        }
        .page-content { display: none; }
        .page-content.active { display: block; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: #2e7d32; font-size: 16px; }
        input[type="text"], input[type="date"] {
            width: 100%; padding: 12px 15px; border: 2px solid var(--border-color); border-radius: 12px; outline: none;
        }
        .reptile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .reptile-card {
            border: 2px solid var(--border-color); border-radius: 16px; padding: 10px;
            text-align: center; cursor: pointer; background: #fafafa; transition: all 0.2s;
        }
        .reptile-card.selected { background-color: #e8f5e9; border-color: var(--primary); }
        .reptile-emoji { font-size: 30px; display: block; }
        .reptile-name { font-size: 13px; font-weight: 500; }
        
        .todo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .todo-item {
            display: flex; align-items: center; padding: 12px;
            border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; background: #fff;
        }
        .todo-item input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; accent-color: var(--primary); }
        
        /* 展開的動態區塊基底 */
        .sub-input-box { background: #f9f9f9; border: 2px dashed #4CAF50; border-radius: 12px; padding: 15px; margin-top: -10px; margin-bottom: 15px; display: none; }
        
        /* 食物選單專用樣式 */
        .food-item-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; background: #fff; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; }
        .food-label-part { display: flex; align-items: center; font-weight: 500; font-size: 15px; }
        .food-label-part input[type="checkbox"] { margin-right: 8px; width: 16px; height: 16px; accent-color: var(--primary); }
        .food-input-qty { width: 100px !important; padding: 6px 10px !important; text-align: center; }
        .food-other-detail { display: none; margin-top: 8px; }

        button[type="submit"] {
            width: 100%; padding: 15px; background-color: var(--primary); color: white;
            border: none; border-radius: 15px; font-size: 18px; font-weight: 700; cursor: pointer;
        }
        .iframe-container { position: relative; overflow: hidden; width: 100%; padding-top: 120%; border-radius: 15px; border: 2px solid var(--border-color); }
        .iframe-container iframe { position: absolute; top: 0; left: 0; bottom: 0; right: 0; width: 100%; height: 100%; border: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 350px; }
        .modal-btn { margin-top: 20px; padding: 10px 25px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>爬蟲日常照顧系統 🦎</h1>
        <p class="subtitle">用心記錄各位寶貝的暖心日常</p>
    </header>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchPage('formPage', this)">✍️ 填寫本日紀錄</button>
        <button class="tab-btn" onclick="switchPage('listPage', this)">📅 查看當日進度</button>
    </div>

    <div id="formPage" class="page-content active">
        <form id="trackerForm">
            <div class="form-group">
                <label for="recordDate">填寫日期</label>
                <input type="date" id="recordDate" required>
            </div>

            <div class="form-group">
                <label for="keeperName">記錄者姓名</label>
                <input type="text" id="keeperName" placeholder="例如：陳大" required>
            </div>

            <div class="form-group">
                <label>選擇照顧動物</label>
                <div class="reptile-grid">
                    <div class="reptile-card" data-value="變色龍"><span class="reptile-emoji">🦎</span><span class="reptile-name">變色龍</span></div>
                    <div class="reptile-card" data-value="蛇"><span class="reptile-emoji">🐍</span><span class="reptile-name">蛇</span></div>
                    <div class="reptile-card" data-value="龍蜥"><span class="reptile-emoji">🦖</span><span class="reptile-name">龍蜥</span></div>
                    <div class="reptile-card" data-value="眼斑水龜"><span class="reptile-emoji">🐢</span><span class="reptile-name">眼斑水龜</span></div>
                    <div class="reptile-card" data-value="鬆獅蜥蜴"><span class="reptile-emoji">🌵</span><span class="reptile-name">鬆獅蜥蜴</span></div>
                    <div class="reptile-card" data-value="紅腿象龜"><span class="reptile-emoji">🧱</span><span class="reptile-name">紅腿象龜</span></div>
                </div>
                <input type="hidden" id="selectedReptile" required>
            </div>

            <div class="form-group">
                <label>已完成事項 (可多選)</label>
                <div class="todo-grid">
                    <label class="todo-item"><input type="checkbox" name="todo" value="換水"><span>💧 換水</span></label>
                    <label class="todo-item"><input type="checkbox" name="todo" value="噴水"><span>💨 噴水</span></label>
                    <label class="todo-item"><input type="checkbox" name="todo" value="餵食" id="feedCheck"><span>🐛 餵食</span></label>
                    <label class="todo-item"><input type="checkbox" name="todo" value="清潔"><span>🧹 清潔環境</span></label>
                    <label class="todo-item"><input type="checkbox" name="todo" value="浸水"><span>🛁 浸水</span></label>
                    <label class="todo-item"><input type="checkbox" name="todo" value="磅重" id="weightCheck"><span>⚖️ 磅重</span></label>
                </div>
            </div>

            <div class="sub-input-box" id="feedInputBox">
                <label style="font-size: 14px; color: var(--text-light); margin-bottom: 10px;">請選擇餵食種類並填寫數量：</label>
                
                <div class="food-item-row">
                    <label class="food-label-part"><input type="checkbox" class="food-cb" value="蟋蟀"> 蟋蟀</label>
                    <input type="text" id="qtyCricket" class="food-input-qty" placeholder="數量 (如: 5隻)">
                </div>
                
                <div class="food-item-row">
                    <label class="food-label-part"><input type="checkbox" class="food-cb" value="大白鼠"> 大白鼠</label>
                    <input type="text" id="qtyDubia" class="food-input-qty" placeholder="數量 (如: 3隻)">
                </div>
                
                <div class="food-item-row" style="flex-wrap: wrap; margin-bottom:0;">
                    <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                        <label class="food-label-part"><input type="checkbox" id="foodCbOther" value="其他"> 其他</label>
                        <input type="text" id="qtyOther" class="food-input-qty" placeholder="數量 (如: 1盤)">
                    </div>
                    <div class="food-other-detail" id="foodOtherDetailBox" style="width:100%;">
                        <input type="text" id="foodOtherDesc" placeholder="請填寫食物種類說明 (如：桑葉、高麗菜、飼料)">
                    </div>
                </div>
            </div>

            <div class="sub-input-box" id="weightInputBox">
                <label>動物重量 (g)</label>
                <input type="text" id="petWeight" placeholder="例如：180">
            </div>

            <div class="form-group">
                <label>周邊生態維護</label>
                <label class="todo-item">
                    <input type="checkbox" id="cricketBoxCheck" value="是">
                    <span>🏠 清潔蟋蟀箱並餵食</span>
                </label>
            </div>

            <button type="submit" id="submitBtn">叮咚！送出今日紀錄 🚀</button>
        </form>
    </div>

    <div id="listPage" class="page-content">
        <label style="margin-bottom: 15px; color:#2e7d32;">📊 雲端即時照顧看板</label>
        <div class="iframe-container">
            <iframe id="excelIframe" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS4YVYMqJDfrx5ZpRRiXQugc5TJqrB1MgB8Ol3gtPBx8Y5EdMldYSX4qpsx4WcPjdIPiFqPEZwoYW1i/pubhtml?widget=true&amp;headers=false"></iframe>
        </div>
    </div>
</div>

<div class="modal" id="successModal">
    <div class="modal-content">
        <div class="modal-emoji" style="font-size:48px">🎉</div>
        <h2>紀錄成功送出！</h2>
        <p style="color:#666; margin-top:10px;">數據已同步至 Google 試算表囉！</p>
        <button class="modal-btn" onclick="closeModal()">太棒了</button>
    </div>
</div>

<script>
    function switchPage(pageId, btnElement) {
        document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        btnElement.classList.add('active');
        if(pageId === 'listPage') {
            const iframe = document.getElementById('excelIframe');
            iframe.src = iframe.src;
        }
    }

    document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
    const cards = document.querySelectorAll('.reptile-card');
    const hiddenInput = document.getElementById('selectedReptile');
    cards.forEach(card => {
        card.addEventListener('click', () => {
            cards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            hiddenInput.value = card.getAttribute('data-value');
        });
    });

    // 餵食主控制
    const feedCheck = document.getElementById('feedCheck');
    const feedInputBox = document.getElementById('feedInputBox');
    feedCheck.addEventListener('change', () => { feedInputBox.style.display = feedCheck.checked ? 'block' : 'none'; });

    // 「其他」食物的文字框彈出控制
    const foodCbOther = document.getElementById('foodCbOther');
    const foodOtherDetailBox = document.getElementById('foodOtherDetailBox');
    foodCbOther.addEventListener('change', () => { foodOtherDetailBox.style.display = foodCbOther.checked ? 'block' : 'none'; });

    const weightCheck = document.getElementById('weightCheck');
    const weightInputBox = document.getElementById('weightInputBox');
    weightCheck.addEventListener('change', () => { weightInputBox.style.display = weightCheck.checked ? 'block' : 'none'; });

    document.getElementById('trackerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if(!hiddenInput.value) { alert('請先點選一隻爬蟲動物唷！'); return; }

        let checkedTodos = [];
        document.querySelectorAll('input[name="todo"]:checked').forEach(cb => { checkedTodos.push(cb.value); });
        
        // 整理食物複選結果
        let foodArray = [];
        document.querySelectorAll('.food-cb:checked').forEach(cb => {
            if(cb.value === "蟋蟀") {
                let qty = document.getElementById('qtyCricket').value || '未填';
                foodArray.push(`蟋蟀(${qty})`);
            } else if(cb.value === "大白鼠") {
                let qty = document.getElementById('qtyDubia').value || '未填';
                foodArray.push(`大白鼠(${qty})`);
            }
        });
        if(foodCbOther.checked) {
            let desc = document.getElementById('foodOtherDesc').value || '其他食物';
            let qty = document.getElementById('qtyOther').value || '未填';
            foodArray.push(`${desc}(${qty})`);
        }
        let foodDetails = feedCheck.checked ? (foodArray.join('、') || '勾選餵食但未選種類') : '無';

        let weightDetail = weightCheck.checked ? (document.getElementById('petWeight').value || '未磅') : '無';

        const formData = {
            date: document.getElementById('recordDate').value,
            name: document.getElementById('keeperName').value,
            reptile: hiddenInput.value,
            todos: checkedTodos.join('、') || '無',
            food: foodDetails,
            weight: weightDetail,
            cricketBox: document.getElementById('cricketBoxCheck').checked ? "已清潔與餵食" : "未執行"
        };

        // ⚠️ 請替換為您的 Apps Script 網頁應用程式 URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBp3M8AipphRE7z1JkgsCmrMmzbWwQhXzgU7MRWQICx0J-1F6r2jBF-vCap3kxgluq/exec";

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "數據傳送中... 🚚";
        submitBtn.disabled = true;

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        }).then(() => {
            document.getElementById('successModal').style.display = 'flex';
            submitBtn.innerText = "叮咚！送出今日紀錄 🚀";
            submitBtn.disabled = false;
            document.getElementById('trackerForm').reset();
            document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
            cards.forEach(c => c.classList.remove('selected'));
            hiddenInput.value = "";
            feedInputBox.style.display = 'none';
            foodOtherDetailBox.style.display = 'none';
            weightInputBox.style.display = 'none';
        }).catch(err => {
            alert('傳送失敗：' + err);
            submitBtn.disabled = false;
        });
    });

    function closeModal() { document.getElementById('successModal').style.display = 'none'; }
</script>
</body>
</html>
