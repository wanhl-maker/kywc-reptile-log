<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爬蟲小寶貝的萌寵日常紀錄 🦎</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --secondary: #FF9800;
            --bg-color: #f1f8f5;
            --card-bg: #ffffff;
            --text-dark: #333333;
            --text-light: #666666;
            --border-color: #e0e0e0;
            --shadow: 0 8px 24px rgba(76, 175, 80, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#4caf50 1px, transparent 1px), radial-gradient(#ff9800 1px, #f1f8f5 1px);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            color: var(--text-dark); padding: 20px; min-height: 100vh;
        }
        .container {
            max-width: 650px; margin: 20px auto; background: var(--card-bg);
            border-radius: 30px; padding: 40px 30px; box-shadow: var(--shadow);
            border: 4px solid #4CAF50; position: relative;
        }
        header { text-align: center; margin-bottom: 35px; }
        h1 { font-size: 26px; color: #2e7d32; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: var(--text-light); }
        .form-group { margin-bottom: 25px; }
        label { display: block; font-weight: 700; margin-bottom: 10px; color: #2e7d32; font-size: 16px; }
        input[type="text"], input[type="date"] {
            width: 100%; padding: 12px 15px; border: 2px solid var(--border-color);
            border-radius: 12px; font-size: 15px; outline: none; transition: all 0.3s;
        }
        input[type="text"]:focus, input[type="date"]:focus { border-color: var(--primary); }
        .reptile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .reptile-card {
            border: 2px solid var(--border-color); border-radius: 16px; padding: 12px;
            text-align: center; cursor: pointer; transition: all 0.2s; background: #fafafa;
        }
        .reptile-card:hover { transform: translateY(-3px); border-color: var(--secondary); }
        .reptile-card.selected { background-color: #e8f5e9; border-color: var(--primary); box-shadow: 0 4px 12px rgba(76, 175, 80, 0.15); }
        .reptile-emoji { font-size: 32px; display: block; margin-bottom: 4px; }
        .reptile-name { font-size: 14px; font-weight: 500; }
        .todo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .todo-item {
            display: flex; align-items: center; padding: 12px 15px;
            border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; background: #fff;
        }
        .todo-item input[type="checkbox"] { margin-right: 12px; width: 18px; height: 18px; accent-color: var(--primary); }
        .sub-input-box {
            background: #f9f9f9; border: 2px dashed #4CAF50; border-radius: 12px;
            padding: 15px; margin-top: -15px; margin-bottom: 20px; display: none;
        }
        .sub-input-flex { display: flex; gap: 10px; }
        .sub-input-flex div { flex: 1; }
        button[type="submit"] {
            width: 100%; padding: 15px; background-color: var(--primary); color: white;
            border: none; border-radius: 15px; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        button[type="submit"]:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 350px; }
        .modal-btn { margin-top: 20px; padding: 10px 25px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>爬蟲日常照顧紀錄 🦎</h1>
        <p class="subtitle">讓每一隻冷血寶貝，都能感受到暖暖的愛 ❤️</p>
    </header>

    <form id="trackerForm">
        <div class="form-group">
            <label for="recordDate">填寫日期</label>
            <input type="date" id="recordDate" required>
        </div>

        <div class="form-group">
            <label for="keeperName">記錄者姓名</label>
            <input type="text" id="keeperName" placeholder="例如：小明 / 綠綠" required>
        </div>

        <div class="form-group">
            <label>選擇照顧動物</label>
            <div class="reptile-grid">
                <div class="reptile-card" data-value="變色龍"><span class="reptile-emoji">🦎</span><span class="reptile-name">變色龍</span></div>
                <div class="reptile-card" data-value="蛇"><span class="reptile-emoji">🐍</span><span class="reptile-name">蛇</span></div>
                <div class="reptile-card" data-value="龍蜥"><span class="reptile-emoji">🦖</span><span class="reptile-name">龍蜥</span></div>
                <div class="reptile-card" data-value="眼斑水龜"><span class="reptile-emoji">🐢</span><span class="reptile-name">眼斑水龜</span></div>
                <div class="reptile-card" data-value="鬆獅蜥蜴"><span class="reptile-emoji">🦖</span><span class="reptile-name">鬆獅蜥蜴</span></div>
                <div class="reptile-card" data-value="紅腿象龜"><span class="reptile-emoji">🐢</span><span class="reptile-name">紅腿象龜</span></div>
            </div>
            <input type="hidden" id="selectedReptile" required>
        </div>

        <div class="form-group">
            <label>已完成事項 (可多選)</label>
            <div class="todo-grid">
                <label class="todo-item"><input type="checkbox" name="todo" value="換水"><span>💧 換水</span></label>
                <label class="todo-item"><input type="checkbox" name="todo" value="噴水"><span>💨 噴水</span></label>
                <label class="todo-item"><input type="checkbox" name="todo" value="餵食" id="feedCheck"><span>🐛 餵食</span></label>
                <label class="todo-item"><input type="checkbox" name="todo" value="清潔"><span>🧹 清潔環境</span></label>
                <label class="todo-item"><input type="checkbox" name="todo" value="浸水"><span>🛁 浸水</span></label>
                <label class="todo-item"><input type="checkbox" name="todo" value="磅重" id="weightCheck"><span>⚖️ 磅重</span></label>
            </div>
        </div>

        <!-- 餵食動態附加欄位 -->
        <div class="sub-input-box" id="feedInputBox">
            <div class="sub-input-flex">
                <div><label>食物種類</label><input type="text" id="foodType" placeholder="如: 杜比亞、蟋蟀"></div>
                <div><label>數量</label><input type="text" id="foodQty" placeholder="如: 5隻"></div>
            </div>
        </div>

        <!-- 磅重動態附加欄位 -->
        <div class="sub-input-box" id="weightInputBox">
            <label>動物重量 (g)</label>
            <input type="text" id="petWeight" placeholder="例如：180">
        </div>

        <div class="form-group">
            <label>周邊生態維護</label>
            <label class="todo-item">
                <input type="checkbox" id="cricketBoxCheck" value="是">
                <span>🏠 清潔蟋蟀箱並餵食</span>
            </label>
        </div>

        <button type="submit" id="submitBtn">叮咚！送出今日紀錄 🚀</button>
    </form>
</div>

<div class="modal" id="successModal">
    <div class="modal-content">
        <div class="modal-emoji" style="font-size:48px">🎉</div>
        <h2>紀錄成功送出！</h2>
        <p style="color:#666; margin-top:10px;">數據已同步至 Google 試算表囉！</p>
        <button class="modal-btn" onclick="closeModal()">太棒了</button>
    </div>
</div>

<script>
    document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
    const cards = document.querySelectorAll('.reptile-card');
    const hiddenInput = document.getElementById('selectedReptile');
    cards.forEach(card => {
        card.addEventListener('click', () => {
            cards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            hiddenInput.value = card.getAttribute('data-value');
        });
    });

    const feedCheck = document.getElementById('feedCheck');
    const feedInputBox = document.getElementById('feedInputBox');
    feedCheck.addEventListener('change', () => { feedInputBox.style.display = feedCheck.checked ? 'block' : 'none'; });

    const weightCheck = document.getElementById('weightCheck');
    const weightInputBox = document.getElementById('weightInputBox');
    weightCheck.addEventListener('change', () => { weightInputBox.style.display = weightCheck.checked ? 'block' : 'none'; });

    document.getElementById('trackerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if(!hiddenInput.value) { alert('請先點選一隻爬蟲動物唷！'); return; }

        let checkedTodos = [];
        document.querySelectorAll('input[name="todo"]:checked').forEach(cb => { checkedTodos.push(cb.value); });

        let foodDetails = feedCheck.checked ? `${document.getElementById('foodType').value || '未填'}(${document.getElementById('foodQty').value || '0'})` : '無';
        let weightDetail = weightCheck.checked ? (document.getElementById('petWeight').value || '未磅') : '無';

        const formData = {
            date: document.getElementById('recordDate').value,
            name: document.getElementById('keeperName').value,
            reptile: hiddenInput.value,
            todos: checkedTodos.join('、') || '無',
            food: foodDetails,
            weight: weightDetail,
            cricketBox: document.getElementById('cricketBoxCheck').checked ? "已清潔與餵食" : "未執行"
        };

        // ⚠️ 請把下方這一行換成你在步驟二獲得的 Google Web App 網址 ⚠️
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBp3M8AipphRE7z1JkgsCmrMmzbWwQhXzgU7MRWQICx0J-1F6r2jBF-vCap3kxgluq/exec";

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "數據傳送中... 🚚";
        submitBtn.disabled = true;

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        }).then(() => {
            document.getElementById('successModal').style.display = 'flex';
            submitBtn.innerText = "叮咚！送出今日紀錄 🚀";
            submitBtn.disabled = false;
            document.getElementById('trackerForm').reset();
            document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
            cards.forEach(c => c.classList.remove('selected'));
            hiddenInput.value = "";
            feedInputBox.style.display = 'none';
            weightInputBox.style.display = 'none';
        }).catch(err => {
            alert('傳送失敗：' + err);
            submitBtn.disabled = false;
        });
    });

    function closeModal() { document.getElementById('successModal').style.display = 'none'; }
</script>
</body>
</html>
